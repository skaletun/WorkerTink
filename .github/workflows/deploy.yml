name: Deploy WorkerTink to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    env:
      VITE_WTINK_DIRECTORY_URL: ${{ vars.WTINK_DIRECTORY_URL || 'https://workertink-directory.workertink-directory.workers.dev' }}
      VITE_BUILD_ID: ${{ github.sha }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Run npm run build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-error.log
          exit ${PIPESTATUS[0]}
      - name: Publish temporary build diagnostics
        if: steps.build.outcome == 'failure'
        uses: actions/github-script@v8
        env:
          BUILD_LOG: build-error.log
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.BUILD_LOG, 'utf8').slice(-20000);
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[CI DEBUG] WTinker build diagnostics',
              body: 'Temporary diagnostic issue for commit ' + context.sha + '\n\n```text\n' + body + '\n```'
            });
            core.setFailed('Temporary diagnostics issue: #' + issue.data.number);
      - name: Verify release version
        run: node -e "const p=require('./package.json'); if(p.version!=='7.2.0') throw new Error('Expected WTinker 7.2.0, got '+p.version)"
      - name: Verify Directory API health
        run: |
          for i in $(seq 1 10); do
            body=$(curl -fsS --max-time 10 "${VITE_WTINK_DIRECTORY_URL}/health" || true)
            if echo "$body" | grep -q '"ok":true'; then exit 0; fi
            sleep 3
          done
          echo "Directory API health check failed"
          exit 1
      - name: Verify Directory API route surface
        run: |
          set -euo pipefail
          base="${VITE_WTINK_DIRECTORY_URL}"
          for endpoint in             "/auth/status"             "/friends"             "/social/feed?limit=1"             "/network/home"             "/network/people?query="             "/network/groups"             "/network/posts/saved"             "/chat/keys/me"             "/company/channels"             "/work/teams"
          do
            code="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "${base}${endpoint}" || true)"
            case "$code" in
              404) echo "Directory route missing: $endpoint"; exit 1 ;;
              000) echo "Directory route unreachable: $endpoint"; exit 1 ;;
            esac
            echo "$endpoint -> $code"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test deployed Pages
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          for i in $(seq 1 10); do
            body=$(curl -fsSL --max-time 15 "$url" || true)
            if echo "$body" | grep -q 'WTinker'; then exit 0; fi
            sleep 4
          done
          echo "Pages smoke test failed: $url"
          exit 1
