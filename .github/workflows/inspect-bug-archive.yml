name: Inspect WTinker bug archive

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload bug archive
        uses: actions/upload-artifact@v4
        with:
          name: wtinker-bug-archive
          path: wtinker_bugs_UIUX.zip
          if-no-files-found: error
