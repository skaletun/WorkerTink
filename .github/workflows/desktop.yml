name: Build WorkerTink Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm test
      - run: npm run desktop:win
      - uses: actions/upload-artifact@v4
        with:
          name: workertink-windows
          path: release/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run desktop:mac
      - uses: actions/upload-artifact@v4
        with:
          name: workertink-macos
          path: release/*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run desktop:linux
      - uses: actions/upload-artifact@v4
        with:
          name: workertink-linux
          path: release/*

  release:
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: workertink-*
          path: release
          merge-multiple: true
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find release -maxdepth 1 -type f | head -n 1)"
          echo "Release assets:"
          find release -maxdepth 1 -type f -printf '%f\n' | sort
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WorkerTink ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
