name: Pull request validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit and regression tests
        run: npm test
      - name: TypeScript and production build
        run: npm run build
      - name: Install Chromium for messenger visual regression
        run: npx playwright install --with-deps chromium
      - name: Validate standalone mobile and desktop chat
        run: npx playwright test tests/visual/wtinker.visual.spec.cjs --grep 'full-screen Telegram-style private chat navigation'
      - name: Validate E2E key retention after application reload
        run: npx playwright test tests/visual/e2e-update.visual.spec.cjs
      - name: Validate PWA upgrade preserves private key and offline queue
        run: npx playwright test tests/visual/pwa-update-rescue.visual.spec.cjs
      - name: Install WebKit for Safari engine regression
        run: npx playwright install --with-deps webkit
      - name: Validate Safari engine PWA upgrade and private data retention
        run: npx playwright test tests/visual/pwa-update-rescue.visual.spec.cjs --browser=webkit
      - name: Validate encrypted E2E recovery UI
        run: npx playwright test tests/visual/e2e-backup.visual.spec.cjs
      - name: Validate authenticated cross-device E2E pairing
        run: npx playwright test tests/visual/e2e-pairing.visual.spec.cjs
      - name: Validate durable encrypted offline chat delivery
        run: npx playwright test tests/visual/offline-outbox.visual.spec.cjs
      - name: Validate durable offline shift editor drafts
        run: npx playwright test tests/visual/shift-draft.visual.spec.cjs
      - name: Validate public landing at mobile, tablet and desktop sizes
        run: npx playwright test tests/visual/landing.visual.spec.cjs
      - name: Save landing visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-visual-evidence
          path: visual-audit-artifacts/landing-*.png
          if-no-files-found: ignore
      - name: Keep messenger visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: messenger-visual-evidence
          path: visual-audit-artifacts/messenger-*.png
          if-no-files-found: ignore
