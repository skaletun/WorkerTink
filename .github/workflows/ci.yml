name: Pull request validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit and regression tests
        run: npm test
      - name: TypeScript and production build
        run: npm run build
      - name: Install Chromium for messenger visual regression
        run: npx playwright install --with-deps chromium
      - name: Validate standalone mobile and desktop chat
        run: npx playwright test tests/visual/wtinker.visual.spec.cjs --grep 'full-screen Telegram-style private chat navigation'
